<style>
:root {
  --paper: #FBF7F2;
  --ink: #1F1A17;
  --muted: #6B605A;
  --green: #23402F;
  --green-soft: #E3EADF;
  --rose: #B4475C;
  --rose-soft: #F3E0DA;
  --line: #E7DACF;
  --card: #FFFFFF;
  --serif: Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
input, textarea, button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
html:not(.js) .needs-js { display: none; }
.nojs .warn { background: var(--rose-soft); border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
.nojs ol { padding-left: 22px; }
.nojs li { margin: 0 0 12px; }
.nojs li small { display: block; color: var(--muted); }
.nojs h2 { font-family: var(--serif); color: var(--green); font-size: 20px; margin: 20px 0 8px; }
.head { background: var(--green); color: #F4F1EA; border-radius: 18px; padding: 22px 20px; }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; line-height: 1.15; margin: 0 0 8px; color: #fff; }
.head p { margin: 0; color: #DCE5DE; }
.head .voice-hint { margin-top: 10px; color: #fff; font-weight: 600; }
.privacy { margin-top: 14px; display: flex; gap: 10px; align-items: flex-start; background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.privacy b { color: #F2B8C4; }

.progress { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 12px 0 10px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--rose); transition: width 200ms; }
.progress small { color: var(--muted); font-size: 13px; }

section.block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
section.block h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--green); margin: 0 0 6px; }
.q { padding: 12px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q > label, .q > .label { display: block; font-weight: 600; margin-bottom: 8px; }
.q .req { color: var(--rose); }
.q input[type="text"], .q textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.q textarea { min-height: 88px; resize: vertical; }
.with-mic { display: grid; gap: 6px; }
.mic {
  justify-self: start;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--green);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.mic:hover { border-color: var(--green); }
.mic.listening { background: var(--rose); border-color: var(--rose); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(180, 71, 92, 0.18); } }
@media (prefers-reduced-motion: reduce) { .mic.listening { animation: none; } }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--paper); }
.opt:has(input:checked) { border-color: var(--green); background: var(--green-soft); }
.opt input { margin-top: 4px; accent-color: var(--green); }
.q.invalid input[type="text"], .q.invalid textarea, .q.invalid .opt { border-color: var(--rose); }
.q .err { color: var(--rose); font-size: 13px; margin-top: 6px; display: none; }
.q.invalid .err { display: block; }

.send { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
.consent { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.consent input { margin-top: 4px; accent-color: var(--green); }
.buttons { display: grid; gap: 10px; }
.btn { border: 1px solid var(--green); background: var(--green); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--green); }
.btn.rose { background: var(--rose); border-color: var(--rose); }
.status { margin-top: 12px; font-size: 14px; color: var(--green); min-height: 20px; }
.status.bad { color: var(--rose); }
.small { font-size: 13px; color: var(--muted); margin-top: 10px; }
.clear { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }
</style>

<script>
// Конфиденциальная анкета: рисует вопросы из window.ANKETA, хранит черновик только в этом браузере
// и собирает ответы в текст, который клиент сам отправляет личным сообщением.
(function () {
  "use strict";
  const A = window.ANKETA;
  const WA_TEXT_LIMIT = 3500;
  const allFields = A.sections.flatMap((s) => s.fields);

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === undefined || v === null || v === false) return;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    });
    children.flat().forEach((c) => { if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c))); });
    return node;
  }

  // ---------- draft (local only) ----------
  function loadDraft() {
    try { return JSON.parse(localStorage.getItem(A.storageKey) || "{}"); } catch (e) { return {}; }
  }
  function saveDraft(answers) {
    try { localStorage.setItem(A.storageKey, JSON.stringify(answers)); } catch (e) { /* storage blocked: the form still works */ }
  }
  function clearDraft() {
    try { localStorage.removeItem(A.storageKey); } catch (e) { /* nothing to clear */ }
  }

  let answers = loadDraft();

  function setAnswer(id, value) {
    answers = { ...answers, [id]: value };
    saveDraft(answers);
    updateProgress();
    const q = document.querySelector(`[data-q="${id}"]`);
    if (q && isAnswered(id)) q.classList.remove("invalid");
  }

  function isAnswered(id) {
    const v = answers[id];
    return Array.isArray(v) ? v.length > 0 : Boolean(v && String(v).trim());
  }

  // ---------- voice input ----------
  // Speech is recognised by the browser or the phone keyboard (Google or Apple), never by this page.
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let activeVoice = null;

  function stopVoice() {
    if (!activeVoice) return;
    const { rec, button } = activeVoice;
    activeVoice = null;
    button.classList.remove("listening");
    button.textContent = "🎤 Надиктовать";
    try { rec.stop(); } catch (e) { /* already stopped */ }
  }

  function appendToField(input, text) {
    const clean = text.trim();
    if (!clean) return;
    input.value = input.value.trim() ? `${input.value.trim()} ${clean}` : clean;
    setAnswer(input.id, input.value);
  }

  function startVoice(input, button) {
    if (activeVoice && activeVoice.button === button) return stopVoice();
    stopVoice();
    if (!Recognition) {
      input.focus();
      status("Нажмите значок микрофона на клавиатуре телефона и говорите — текст появится в поле. На компьютере с Windows: Win + H.");
      return;
    }
    const rec = new Recognition();
    rec.lang = "ru-RU";
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        if (event.results[i].isFinal) appendToField(input, event.results[i][0].transcript);
      }
    };
    rec.onerror = (event) => {
      const reason = event.error === "not-allowed" || event.error === "service-not-allowed"
        ? "Разрешите доступ к микрофону или нажмите микрофон на клавиатуре телефона."
        : "Голосовой ввод сейчас недоступен — нажмите микрофон на клавиатуре телефона.";
      status(reason, true);
      stopVoice();
    };
    rec.onend = () => { if (activeVoice && activeVoice.rec === rec) stopVoice(); };
    activeVoice = { rec, button };
    button.classList.add("listening");
    button.textContent = "■ Готово";
    status("Слушаю… Говорите. Нажмите «Готово», когда закончите.");
    try { rec.start(); } catch (e) {
      stopVoice();
      status("Голосовой ввод сейчас недоступен — нажмите микрофон на клавиатуре телефона.", true);
    }
  }

  function withMic(input) {
    const button = el("button", { type: "button", class: "mic", "aria-label": "Надиктовать ответ голосом", onclick: () => startVoice(input, button) }, "🎤 Надиктовать");
    return el("div", { class: "with-mic" }, input, button);
  }

  // ---------- render ----------
  function fieldInput(f) {
    const value = answers[f.id];
    if (f.type === "textarea") {
      return withMic(el("textarea", { id: f.id, placeholder: f.placeholder, oninput: (e) => setAnswer(f.id, e.target.value) }, value || ""));
    }
    if (f.type === "text") {
      return withMic(el("input", { id: f.id, type: "text", value: value || "", placeholder: f.placeholder, oninput: (e) => setAnswer(f.id, e.target.value) }));
    }
    const multi = f.type === "checkbox";
    const chosen = multi ? (value || []) : value;
    return el("div", { class: "opts", role: multi ? "group" : "radiogroup", "aria-labelledby": `${f.id}-label` }, f.options.map((opt) => {
      const checked = multi ? chosen.includes(opt) : chosen === opt;
      const input = el("input", {
        type: multi ? "checkbox" : "radio", name: f.id, value: opt, checked,
        onchange: (e) => {
          if (!multi) return setAnswer(f.id, opt);
          const current = answers[f.id] || [];
          setAnswer(f.id, e.target.checked ? [...current, opt] : current.filter((x) => x !== opt));
        }
      });
      return el("label", { class: "opt" }, input, el("span", { text: opt }));
    }));
  }

  function renderQuestion(f) {
    const labelTag = f.type === "checkbox" || f.type === "radio" ? "div" : "label";
    const labelAttrs = labelTag === "label" ? { for: f.id } : { class: "label", id: `${f.id}-label` };
    return el("div", { class: "q", "data-q": f.id },
      el(labelTag, labelAttrs, f.label, f.required ? el("span", { class: "req", text: " *" }) : null),
      fieldInput(f),
      el("div", { class: "err", text: "Ответьте, пожалуйста, на этот вопрос" }));
  }

  function render() {
    document.getElementById("title").textContent = A.title;
    document.getElementById("intro").textContent = A.intro;
    document.getElementById("voice-hint").textContent = A.voiceHint;
    document.getElementById("privacy").textContent = A.privacy;
    document.getElementById("consent-text").textContent = A.consent;
    document.getElementById("form").replaceChildren(...A.sections.map((s) =>
      el("section", { class: "block" }, el("h2", { text: s.title }), s.fields.map(renderQuestion))));
    updateProgress();
  }

  function updateProgress() {
    const done = allFields.filter((f) => isAnswered(f.id)).length;
    document.querySelector(".bar span").style.width = `${Math.round((done / allFields.length) * 100)}%`;
    document.getElementById("progress-text").textContent = `Заполнено ${done} из ${allFields.length}`;
  }

  // ---------- compose & send ----------
  /** Builds the plain-text message with all answers. */
  function compose() {
    const lines = [`Анкета «${A.title}»`];
    A.sections.forEach((s) => {
      lines.push("", s.title.toUpperCase());
      s.fields.forEach((f) => {
        const v = answers[f.id];
        const text = Array.isArray(v) ? v.join("; ") : (v || "").trim();
        lines.push(`• ${f.label}: ${text || "—"}`);
      });
    });
    return lines.join("\n");
  }

  function validate() {
    const missing = allFields.filter((f) => f.required && !isAnswered(f.id));
    document.querySelectorAll(".q").forEach((q) => q.classList.toggle("invalid", missing.some((f) => f.id === q.dataset.q)));
    const consent = document.getElementById("consent").checked;
    if (missing.length) {
      document.querySelector(`[data-q="${missing[0].id}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
      return `Осталось ответить на обязательные вопросы: ${missing.length}`;
    }
    if (!consent) return "Отметьте, пожалуйста, согласие внизу";
    return "";
  }

  function status(text, bad) {
    const node = document.getElementById("status");
    node.textContent = text;
    node.className = bad ? "status bad" : "status";
  }

  function sendWhatsApp() {
    const problem = validate();
    if (problem) return status(problem, true);
    const text = compose();
    if (text.length > WA_TEXT_LIMIT) {
      status("Ответы длинные — WhatsApp может обрезать сообщение. Лучше нажмите «Скопировать ответы» и вставьте их в чат.", true);
      return;
    }
    window.open(`https://wa.me/${A.whatsapp}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
    status("Открываю WhatsApp — нажмите там «Отправить».");
  }

  async function copyAnswers() {
    const problem = validate();
    if (problem) return status(problem, true);
    const text = compose();
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const area = el("textarea", { style: "position:fixed;opacity:0" }, text);
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (!ok) return status("Не получилось скопировать автоматически. Выделите ответы вручную или отправьте через WhatsApp.", true);
    }
    status(`Скопировано. Вставьте ответы в личные сообщения ${A.recipient} в Telegram или MAX.`);
  }

  function clearAll() {
    if (!window.confirm("Стереть все ответы на этом устройстве?")) return;
    clearDraft();
    answers = {};
    render();
    status("Ответы стёрты с этого устройства.");
  }

  function init() {
    render();
    document.getElementById("send-wa").addEventListener("click", sendWhatsApp);
    document.getElementById("send-copy").addEventListener("click", copyAnswers);
    document.getElementById("clear").addEventListener("click", clearAll);
  }

  window.AnketaApp = { init, compose, validate, hasRecognition: Boolean(Recognition) };
})();
</script>
<script>AnketaApp.init();</script>
</body>
</html>
